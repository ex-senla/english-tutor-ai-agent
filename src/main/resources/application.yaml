spring:
  application:
    name: eta
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        model: ${AI_CHAT_MODEL}
    chat:
      client:
        observations:
          log-prompt: true
          log-completion: true
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true

eta:
  exercise:
    generation:
      sentence-count: 5

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: eta_tutor_bot

logging:
  level:
    org.springframework.ai: TRACE
    org.springframework.ai.chat.client: TRACE
    org.springframework.ai.openai: TRACE
