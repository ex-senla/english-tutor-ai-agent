spring:
  application:
    name: eta
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        model: ${AI_CHAT_MODEL}
    chat:
      client:
        observations:
          log-prompt: true
          log-completion: true
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true

eta:
  exercise:
    generation:
      sentence-count: 5
  dictionary:
    translation:
      variant-count: 3
    word:
      default-target-repetitions: 2
  chatbot:
    search:
      suggestions-limit: 10
    pagination:
      page-size: 8
    exercise-generation:
      error-message: "⚠️ Не удалось сгенерировать упражнение. Попробуйте, пожалуйста, ещё раз немного позже."
  demo-students:
    enabled: false
    student-count: 3
    min-words-per-student: 3
    max-words-per-student: 5

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

logging:
  level:
    org.springframework.ai: TRACE
    org.springframework.ai.chat.client: TRACE
    org.springframework.ai.openai: TRACE
