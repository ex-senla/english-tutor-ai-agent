services:
  postgres:
    image: postgres:17-alpine
    container_name: eta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eta}
      POSTGRES_USER: ${POSTGRES_USER:-eta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eta}
    ports:
      - "5432:5432"
    volumes:
      - eta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eta} -d ${POSTGRES_DB:-eta}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eta-postgres-data:
